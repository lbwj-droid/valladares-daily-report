name: Daily 7:30 AM Dubai News Update

on:
  schedule:
    # 03:30 UTC = 7:30 AM Dubai Time (GST, UTC+4) every morning
    - cron: '30 3 * * *'
  workflow_dispatch: # Lets you also click a button to trigger an instant update anytime!

permissions:
  contents: write

jobs:
  curate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Valladares Daily Curator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 update_news.py

      - name: Save and Publish Updated Edition
        run: |
          git config user.name "Valladares Auto-Curator"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Automated daily news update"
          git push
